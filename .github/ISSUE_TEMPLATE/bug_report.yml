name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Configure workflow with...
        2. Run the action...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow Configuration
      description: Paste your workflow YAML (or relevant portion)
      render: yaml
      placeholder: |
        - name: Setup CRM SDK
          uses: marcus-hooper/setup-crmsdk@v1
    validations:
      required: false

  - type: dropdown
    id: runner
    attributes:
      label: Runner OS
      description: Which runner are you using?
      options:
        - windows-latest
        - windows-2022
        - windows-2019
        - Self-hosted Windows
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Action Version
      description: Which version of the action are you using?
      options:
        - v1 (latest)
        - main branch
        - Specific SHA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs from the workflow run
      render: shell
      placeholder: Expand the "Setup CRM SDK" step and copy relevant output
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (screenshots, links, etc.)
    validations:
      required: false
