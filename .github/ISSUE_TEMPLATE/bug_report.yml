name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["type:bug", "priority:medium"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below to help us investigate.

        **Before submitting**, please review the [README](https://github.com/marcus-hooper/setup-crmsdk#readme) for usage guidance.

        **Tip**: Enable debug logging by adding `ACTIONS_STEP_DEBUG: true` to your repository secrets or workflow env for more detailed output.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Configure workflow with...
        2. Run the action...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: |
        Describe the actual behavior:
        - What output did you see?
        - Did it fail silently or with an error?
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow Configuration
      description: Paste your workflow YAML (redact any secrets)
      render: yaml
      placeholder: |
        - name: Setup CRM SDK
          uses: marcus-hooper/setup-crmsdk@v1
          with:
            version: '9.1.0.184'
    validations:
      required: true

  - type: dropdown
    id: runner
    attributes:
      label: Runner OS
      description: Which runner are you using?
      options:
        - windows-latest
        - windows-2025
        - windows-2022
        - windows-2019
        - Self-hosted Windows (specify in additional context)
        - Other (specify in additional context)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Action Version
      description: Which version of the action are you using?
      placeholder: "v1, main, or specific SHA"
    validations:
      required: true

  - type: input
    id: crmsdk-version
    attributes:
      label: CRM SDK Version Requested
      description: The version input value (leave blank if using latest)
      placeholder: "9.1.0.184"
    validations:
      required: false

  - type: input
    id: powershell-version
    attributes:
      label: PowerShell Version
      description: Output of $PSVersionTable.PSVersion (if known)
      placeholder: "5.1.22621.4111"
    validations:
      required: false

  - type: textarea
    id: error-message
    attributes:
      label: Error Message
      description: The exact error message (if any), including stack traces
      render: shell
      placeholder: |
        Install-Package: Unable to resolve package...
        At D:\a\repo\Install-CrmSdk.ps1:42 char:5
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs from the workflow run (redact sensitive info)
      render: shell
      placeholder: Expand the "Setup CRM SDK" step and copy relevant output
    validations:
      required: true

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have [searched existing issues](https://github.com/marcus-hooper/setup-crmsdk/issues?q=is%3Aissue) for duplicates
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (screenshots, links, etc.)
    validations:
      required: false
