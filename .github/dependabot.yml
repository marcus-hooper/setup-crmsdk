version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      # CodeQL sub-actions (init, analyze, upload-sarif) are ONE release train and must
      # bump together across ALL update types, or CodeQL desyncs at runtime ("Loaded a
      # configuration file for version X, but running version Y"). The trailing "*" is
      # required — Dependabot names these deps by full sub-path (github/codeql-action/init).
      # Listed FIRST so it wins over the security-actions group (first-matching-group).
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Security-related actions - prioritize these
      security-actions:
        patterns:
          - "ossf/*"
          - "step-security/*"
          - "gitleaks/*"
      # CI/CD actions
      ci-actions:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"
      # Utility actions
      utility-actions:
        patterns:
          - "dependabot/*"
          - "dorny/*"
          - "codecov/*"
          - "EndBug/*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "deps:all"
      - "deps:github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
