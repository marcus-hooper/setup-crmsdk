name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-major-tag:
    name: Update Major Version Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip pre-releases
        if: github.event.release.prerelease
        run: |
          echo "::notice::Skipping major tag update for pre-release"
          echo "## Pre-release Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Major version tag not updated for pre-release." >> "$GITHUB_STEP_SUMMARY"

      - name: Check for CHANGELOG entry
        if: ${{ !github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG entry found for version $VERSION"
            exit 1
          fi

      - name: Extract version info
        if: ${{ !github.event.release.prerelease }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Validate semver format (v1.0.0 or 1.0.0)
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match semver format (e.g., v1.0.0)"
            exit 1
          fi

          # Extract major version
          MAJOR=$(echo "$TAG" | sed -E 's/^v?([0-9]+).*/v\1/')
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Extracted major version: $MAJOR from tag: $TAG"

      - name: Update major version tag
        if: ${{ !github.event.release.prerelease }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAJOR="${{ steps.version.outputs.major }}"
          TAG="${{ steps.version.outputs.tag }}"

          # Try atomic update first (PATCH), fall back to create if tag doesn't exist
          if ! gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$MAJOR" \
            -f sha="${{ github.sha }}" \
            -F force=true 2>/dev/null; then
            # Tag doesn't exist, create it
            gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$MAJOR" \
              -f sha="${{ github.sha }}"
          fi

          echo "Updated $MAJOR tag to point to $TAG"

      - name: Write job summary
        if: ${{ !github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          MAJOR="${{ steps.version.outputs.major }}"
          TAG="${{ steps.version.outputs.tag }}"
          {
            echo "## Release Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Release Tag | \`$TAG\` |"
            echo "| Major Tag | \`$MAJOR\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "The **$MAJOR** tag now points to **$TAG**."
          } >> "$GITHUB_STEP_SUMMARY"
