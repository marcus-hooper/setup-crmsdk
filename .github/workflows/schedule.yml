name: Scheduled Health Check

on:
  schedule:
    # Run weekly on Monday at 6:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    # Allow manual trigger for debugging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  health-check:
    name: Verify External Dependencies
    runs-on: windows-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.nuget.org:443
            azureedge.net:443
            dist.nuget.org:443
            github.com:443
            www.powershellgallery.com:443

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Verify NuGet CLI is downloadable
        timeout-minutes: 2
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -Method Head -UseBasicParsing -ErrorAction Stop
          Write-Host "NuGet CLI endpoint is accessible (HTTP $($response.StatusCode))"

      - name: Verify CrmSdk package exists on NuGet
        timeout-minutes: 2
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.crmsdk.coretools/index.json" -UseBasicParsing -ErrorAction Stop
          $latestVersion = $response.versions | Select-Object -Last 1
          Write-Host "Microsoft.CrmSdk.CoreTools is available on NuGet (latest: $latestVersion)"

      - name: Run setup-crmsdk action
        uses: ./

      - name: Verify CRM_SDK_PATH is set
        shell: pwsh
        run: |
          if (-not $env:CRM_SDK_PATH) {
            Write-Host "::error::CRM_SDK_PATH environment variable is not set"
            exit 1
          }
          Write-Host "CRM_SDK_PATH is set to: $env:CRM_SDK_PATH"

      - name: Verify SolutionPackager exists
        shell: pwsh
        run: |
          $solutionPackager = Join-Path $env:CRM_SDK_PATH "coretools\SolutionPackager.exe"
          if (-not (Test-Path $solutionPackager)) {
            Write-Host "::error::SolutionPackager.exe not found at expected path"
            exit 1
          }
          Write-Host "SolutionPackager.exe found at: $solutionPackager"

      - name: Verify SolutionPackager executes
        shell: pwsh
        run: |
          $solutionPackager = Join-Path $env:CRM_SDK_PATH "coretools\SolutionPackager.exe"
          & $solutionPackager /? | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::SolutionPackager.exe failed to execute"
            exit 1
          }
          Write-Host "SolutionPackager.exe executes successfully"

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings PSGallery -ErrorAction Stop
          $results | Format-Table -AutoSize
          if ($results) {
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "No issues found"

      - name: Run Pester tests
        shell: pwsh
        run: |
          if (Test-Path './tests') {
            $config = New-PesterConfiguration
            $config.Run.Path = './tests'
            $config.Output.Verbosity = 'Detailed'
            $config.Run.Exit = $true
            $config.TestResult.Enabled = $true
            $config.TestResult.OutputPath = 'test-results.xml'
            $config.TestResult.OutputFormat = 'NUnitXml'
            Invoke-Pester -Configuration $config
          } else {
            Write-Host "No tests directory found - skipping"
          }

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: health-check-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # Notify on failure by creating a GitHub issue
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: health-check
    if: failure() && github.event_name == 'schedule'
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Ensure health-check-failure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "health-check-failure" --description "Automated health check detected a failure" --color "d73a4a" --force

      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Check for existing open issue to avoid duplicates
          EXISTING=$(gh issue list --label "health-check-failure" --state open --json number --jq '.[0].number // empty')

          if [[ -n "$EXISTING" ]]; then
            echo "Existing issue #$EXISTING found, adding comment"
            gh issue comment "$EXISTING" --body "Health check failed again on $(date -u '+%Y-%m-%d %H:%M UTC').

[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            echo "Creating new failure issue"
            gh issue create \
              --title "Scheduled health check failed" \
              --label "health-check-failure,type:bug" \
              --body "The scheduled health check workflow failed on $(date -u '+%Y-%m-%d %H:%M UTC').

## Details
- **Workflow:** ${{ github.workflow }}
- **Run ID:** ${{ github.run_id }}
- **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

## Possible Causes
- NuGet CLI endpoint unavailable
- Microsoft.CrmSdk.CoreTools package unavailable
- SolutionPackager.exe execution failure
- Test failures

Please investigate and resolve the issue."
          fi

  # Auto-close failure issues when health check passes
  notify-success:
    name: Close Stale Failure Issues
    runs-on: ubuntu-latest
    needs: health-check
    if: success() && github.event_name == 'schedule'
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Close stale failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --label "health-check-failure" --state open --json number --jq '.[].number' | while read -r issue; do
            if [[ -n "$issue" ]]; then
              echo "Closing issue #$issue"
              gh issue close "$issue" --comment "Health check is passing again as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing automatically."
            fi
          done
          echo "Done processing stale failure issues"
