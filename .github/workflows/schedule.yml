name: Scheduled Health Check

on:
  schedule:
    # Run weekly on Monday at 6:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    # Allow manual trigger for debugging
    inputs:
      skip_issue_creation:
        description: "Skip creating/updating GitHub issues on failure"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  health-check:
    name: Verify External Dependencies
    runs-on: windows-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.nuget.org:443
            azureedge.net:443
            dist.nuget.org:443
            github.com:443
            www.powershellgallery.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify NuGet CLI is downloadable
        id: verify-nuget
        timeout-minutes: 2
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -Method Head -UseBasicParsing -ErrorAction Stop
          Write-Host "NuGet CLI endpoint is accessible (HTTP $($response.StatusCode))"

      - name: Verify CrmSdk package exists on NuGet
        id: verify-package
        timeout-minutes: 2
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.crmsdk.coretools/index.json" -UseBasicParsing -ErrorAction Stop
          $latestVersion = $response.versions | Select-Object -Last 1
          Write-Host "Microsoft.CrmSdk.CoreTools is available on NuGet (latest: $latestVersion)"

      - name: Run setup-crmsdk action
        id: run-action
        uses: ./

      - name: Verify CRM_SDK_PATH is set
        id: verify-env
        shell: pwsh
        run: |
          if (-not $env:CRM_SDK_PATH) {
            Write-Host "::error::CRM_SDK_PATH environment variable is not set"
            exit 1
          }
          Write-Host "CRM_SDK_PATH is set to: $env:CRM_SDK_PATH"

      - name: Verify SolutionPackager exists
        id: verify-packager
        shell: pwsh
        run: |
          $solutionPackager = Join-Path $env:CRM_SDK_PATH "coretools\SolutionPackager.exe"
          if (-not (Test-Path $solutionPackager)) {
            Write-Host "::error::SolutionPackager.exe not found at expected path"
            exit 1
          }
          Write-Host "SolutionPackager.exe found at: $solutionPackager"

      - name: Verify SolutionPackager executes
        id: verify-execution
        shell: pwsh
        run: |
          $solutionPackager = Join-Path $env:CRM_SDK_PATH "coretools\SolutionPackager.exe"
          # Verify the executable can start (checks for missing .NET runtime, DLLs, etc.)
          # Note: SolutionPackager.exe /? returns non-zero exit code by design, so we ignore exit code
          # and only verify the process starts and produces output
          $output = & $solutionPackager /? 2>&1 | Out-String
          $global:LASTEXITCODE = 0  # Reset - SolutionPackager /? returns non-zero by design
          if ([string]::IsNullOrWhiteSpace($output)) {
            Write-Host "::error::SolutionPackager.exe produced no output - may be missing dependencies"
            exit 1
          }
          Write-Host "SolutionPackager.exe executes successfully"
          Write-Host "Output preview:"
          $output.Split("`n") | Select-Object -First 5 | ForEach-Object { Write-Host "  $_" }

      - name: Run PSScriptAnalyzer
        id: lint
        timeout-minutes: 2
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings PSGallery -ErrorAction Stop
          $results | Format-Table -AutoSize
          if ($results) {
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "No issues found"

      - name: Run Pester tests
        id: test
        shell: pwsh
        run: |
          if (Test-Path './tests') {
            $config = New-PesterConfiguration
            $config.Run.Path = './tests'
            $config.Output.Verbosity = 'Detailed'
            $config.Run.Exit = $true
            $config.TestResult.Enabled = $true
            $config.TestResult.OutputPath = 'test-results.xml'
            $config.TestResult.OutputFormat = 'NUnitXml'
            Invoke-Pester -Configuration $config
          } else {
            Write-Host "No tests directory found - skipping"
          }

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: |
          $summary = @"
          ## Health Check Results

          | Check | Status |
          |-------|--------|
          | NuGet CLI accessible | ${{ steps.verify-nuget.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | CrmSdk package available | ${{ steps.verify-package.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Action execution | ${{ steps.run-action.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | CRM_SDK_PATH set | ${{ steps.verify-env.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | SolutionPackager exists | ${{ steps.verify-packager.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | SolutionPackager executes | ${{ steps.verify-execution.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | PSScriptAnalyzer | ${{ steps.lint.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Pester tests | ${{ steps.test.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |

          **Workflow run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: health-check-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # Notify on failure by creating a GitHub issue
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: health-check
    if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_issue_creation))
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Ensure status:health-check-failure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "status:health-check-failure" --description "Automated health check detected a failure" --color "d73a4a" --force

      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_BODY: |
            The scheduled health check workflow failed.

            ## Details
            - **Workflow:** Scheduled Health Check
            - **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## Possible Causes
            - NuGet CLI endpoint unavailable
            - Microsoft.CrmSdk.CoreTools package unavailable
            - SolutionPackager.exe execution failure
            - PSScriptAnalyzer or Pester test failures

            Please investigate and resolve the issue.
        run: |
          set -euo pipefail
          # Check for existing open issue to avoid duplicates
          EXISTING=$(gh issue list --label "status:health-check-failure" --state open --json number --jq '.[0].number // empty')

          if [[ -n "$EXISTING" ]]; then
            echo "Existing issue #$EXISTING found, adding comment"
            gh issue comment "$EXISTING" --body "Health check failed again on $(date -u '+%Y-%m-%d %H:%M UTC'). [View workflow run]($RUN_URL)"
          else
            echo "Creating new failure issue"
            gh issue create \
              --title "Scheduled health check failed" \
              --label "status:health-check-failure,type:bug" \
              --body "$ISSUE_BODY"
          fi

  # Auto-close failure issues when health check passes
  notify-success:
    name: Close Stale Failure Issues
    runs-on: ubuntu-latest
    needs: health-check
    if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_issue_creation))
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Close stale failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issues=$(gh issue list --label "status:health-check-failure" --state open --json number --jq '.[].number' || true)
          if [[ -n "$issues" ]]; then
            while read -r issue; do
              echo "Closing issue #$issue"
              gh issue close "$issue" --comment "Health check is passing again as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing automatically."
            done <<< "$issues"
          fi
          echo "Done processing stale failure issues"
