# CodeQL Security Analysis
#
# Scope: Analyzes GitHub Actions workflow files (YAML) only.
# Note: PowerShell scripts are NOT analyzed by CodeQL (unsupported language).
#       PowerShell security is handled by PSScriptAnalyzer (ci.yml) and
#       custom security checks (security.yml).

name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 6am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      # Scope: This workflow only analyzes GitHub Actions workflows (YAML files).
      # CodeQL does not support PowerShell - PowerShell scripts are analyzed by:
      # - PSScriptAnalyzer in ci.yml (lint and security rules)
      # - Custom security checks in security.yml (hardcoded secrets, unsafe patterns)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@fb650c22f965a3eff7e20c5535e51a256dd16bf1 # v4
        with:
          languages: actions
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fb650c22f965a3eff7e20c5535e51a256dd16bf1 # v4
        with:
          category: "/language:actions"
