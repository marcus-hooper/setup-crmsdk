name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-changelog:
    name: Validate CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate CHANGELOG format
        run: |
          echo "Validating CHANGELOG.md format..."
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          if ! grep -qE "^## \[Unreleased\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing '## [Unreleased]' section"
            exit 1
          fi
          echo "CHANGELOG.md format valid"

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            psg-prod-eastus.azureedge.net:443
            www.powershellgallery.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings PSGallery
          $results | Format-Table -AutoSize
          if ($results) {
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "No issues found"

      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem -Path ./scripts -Include '*.ps1', '*.psm1' -Recurse | ForEach-Object {
            $original = Get-Content -Path $_.FullName -Raw
            $formatted = Invoke-Formatter -ScriptDefinition $original
            if ($original -ne $formatted) {
              Write-Host "::error file=$($_.FullName)::File is not properly formatted"
              $hasErrors = $true
            }
          }
          if ($hasErrors) {
            Write-Error "One or more files are not properly formatted. Run 'Invoke-Formatter' to fix."
            exit 1
          }
          Write-Host "All files are properly formatted"

  unit-test:
    name: Run Pester Tests
    needs: [lint-and-format]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cli.codecov.io:443
            codecov.io:443
            github.com:443
            ingest.codecov.io:443
            storage.googleapis.com:443
            uploader.codecov.io:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Pester tests with coverage
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./scripts/Install-CrmSdk.ps1', './scripts/Install-CrmSdk.psm1')
          $config.CodeCoverage.OutputPath = 'coverage.xml'
          $config.CodeCoverage.OutputFormat = 'JaCoCo'

          $result = Invoke-Pester -Configuration $config

          $covered = $result.CodeCoverage.CommandsExecutedCount
          $total = $result.CodeCoverage.CommandsAnalyzedCount
          if ($total -gt 0) {
            $percent = [math]::Round(($covered / $total) * 100, 2)
            Write-Host "Code Coverage: $percent% ($covered/$total commands)"
          }

          if ($result.FailedCount -gt 0) {
            exit 1
          }

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Pester Tests
          path: test-results.xml
          reporter: java-junit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: Integration Test
    needs: [lint-and-format]
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.nuget.org:443
            azureedge.net:443
            dist.nuget.org:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate action.yml
        shell: bash
        env:
          YQ_VERSION: v4.44.6
        run: |
          echo "Validating action.yml..."
          if [[ ! -f action.yml ]]; then
            echo "::error::action.yml not found"
            exit 1
          fi

          # Download yq for Windows
          curl -sL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_windows_amd64.exe" -o yq.exe

          # Validate YAML syntax
          if ! ./yq.exe eval '.' action.yml > /dev/null 2>&1; then
            echo "::error::action.yml is not valid YAML"
            exit 1
          fi

          # Check for required composite action fields
          if [[ "$(./yq.exe eval '.name' action.yml)" == "null" ]]; then
            echo "::error::action.yml missing 'name' field"
            exit 1
          fi
          if [[ "$(./yq.exe eval '.runs.using' action.yml)" != "composite" ]]; then
            echo "::error::action.yml missing 'runs.using: composite'"
            exit 1
          fi
          echo "action.yml validation passed"

      - name: Run setup-crmsdk action
        uses: ./

      - name: Verify CRM_SDK_PATH is set
        shell: pwsh
        run: |
          if (-not $env:CRM_SDK_PATH) {
            Write-Host "::error::CRM_SDK_PATH environment variable is not set"
            exit 1
          }
          Write-Host "CRM_SDK_PATH is set to: $env:CRM_SDK_PATH"

      - name: Verify SolutionPackager exists
        shell: pwsh
        run: |
          $solutionPackager = Join-Path $env:CRM_SDK_PATH "coretools\SolutionPackager.exe"
          if (-not (Test-Path $solutionPackager)) {
            Write-Host "::error::SolutionPackager.exe not found at expected path"
            exit 1
          }
          Write-Host "SolutionPackager.exe found at: $solutionPackager"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    if: always()
    needs: [validate-changelog, lint-and-format, unit-test, integration-test]

    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.validate-changelog.result }}" != "success" ]] || \
             [[ "${{ needs.lint-and-format.result }}" != "success" ]] || \
             [[ "${{ needs.unit-test.result }}" != "success" ]] || \
             [[ "${{ needs.integration-test.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"
